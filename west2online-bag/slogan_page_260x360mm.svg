<?xml version="1.0" encoding="UTF-8"?>
<?xml-stylesheet type="text/css" href="styles/slogan_page.css"?>
<svg xmlns="http://www.w3.org/2000/svg"
     width="266mm" height="366mm" viewBox="-3 -3 266 366"
     data-trim-width-mm="260" data-trim-height-mm="360" data-bleed-mm="3"
     role="img" aria-labelledby="page-title page-description">
  <title id="page-title">West2 Online · 标语面 · 260 × 360 mm，四边出血 3 mm</title>
  <desc id="page-description">以 slogan_page_13x18.png 为背景裁切参考，标语主体与遮罩在成品区域内居中；出血不改变成品取景。</desc>

  <!--
    单位为 mm。成品框：(0, 0, 260, 360)，含出血画布：(-3, -3, 266, 366)。
    参考图精确对应原 2298 × 2738 导出图的 (252, 0, 1978, 2738) 裁框。
    保留参考取景中心，精确 13:18 裁框映射回原 1149 × 1369 坐标：
    x=126.138888889，y=0，width=988.722222222，height=1369。
    沿用原页面对手工裁后背景的映射；左右出血使用已有内容。
    顶部和底部仅在成品线外镜像延展 3 mm，不缩放成品区域来凑出血。
  -->
  <g id="background-layer">
    <image id="background-art"
           x="-33.170197224251" y="-3.155378486056"
           width="302.147552958364" height="366.310756972112"
           preserveAspectRatio="none"
           data-bleed-source="assets/slogan_page_bg/output/image-halftone-after-cut.png"
           data-extend-vertical-px="11"
           href="output/slogan_page/260x360mm_origin/slogan_page_260x360mm-background-bleed.png" />
  </g>

  <!-- 与徽标面相同：169.6444 × 239.6564 mm；主体中心为 (130, 180)。 -->
  <g id="sloganbody-placement"
     transform="translate(130 180) scale(0.168298027757487) translate(-504 -712)">
    <rect id="sloganbody-underlay" class="sloganbody-underlay"
          x="0" y="0" width="1008" height="1424" />
    <image id="sloganbody-art"
           x="0" y="0" width="1008" height="1424"
           preserveAspectRatio="xMidYMid meet"
           href="assets/sloganbody/sloganbody.svg" />
  </g>
</svg>
