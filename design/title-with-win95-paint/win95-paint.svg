    <rect id="window-shell" x="10" y="10" width="916.1363636363636" height="610" fill="#C0C0C0" />
    <path d="M10 620V10H926.1363636363636" stroke="#FFFFFF" stroke-width="3" />
    <path d="M12 620H926.1363636363636V12" stroke="#808080" stroke-width="3" />
    <path d="M14 618H924.1363636363636V14" stroke="#000000" stroke-width="2" />

    <g id="paint-title-bar">
      <rect x="17" y="17" width="902.1363636363636" height="29" fill="#000080" />
