          <path d="M889.1363636363636 42V21H911.1363636363636" stroke="#FFFFFF" stroke-width="2" />
          <path d="M891.1363636363636 42H911.1363636363636V23" stroke="#000000" stroke-width="2" />
          <path d="M896.1363636363636 27L905.1363636363636 36M905.1363636363636 27L896.1363636363636 36" stroke="#000000" stroke-width="2" />
        </g>
