      <text x="58" y="69" class="menu-text"><tspan text-decoration="underline">E</tspan>dit</text>
      <text x="94" y="69" class="menu-text"><tspan text-decoration="underline">V</tspan>iew</text>
      <text x="136" y="69" class="menu-text"><tspan text-decoration="underline">I</tspan>mage</text>
      <text x="189" y="69" class="menu-text"><tspan text-decoration="underline">O</tspan>ptions</text>
      <text x="252" y="69" class="menu-text"><tspan text-decoration="underline">H</tspan>elp</text>
      <path d="M17 78H919.1363636363636" stroke="#808080" />
      <path d="M17 79H919.1363636363636" stroke="#FFFFFF" />
    </g>

