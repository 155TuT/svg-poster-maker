<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
  width="1373" height="924" viewBox="0 0 936.1363636363636 630" fill="none"
  role="img" aria-labelledby="paint-title paint-description">
  <title id="paint-title">Windows 95 Paint interface</title>
  <desc id="paint-description">A vector recreation of the classic Windows 95 Paint window with toolbox, blank canvas, palette, and status bar.</desc>

  <defs>
    <style><![CDATA[
      .ui-text {
        font-family: Arial, sans-serif;
        font-size: 15px;
        fill: #000000;
      }
      .menu-text {
        font-family: Arial, sans-serif;
        font-size: 16px;
        fill: #000000;
      }
      .title-text {
        font-family: Arial, sans-serif;
        font-size: 16px;
        font-weight: 700;
        fill: #FFFFFF;
      }
      .pixel {
        shape-rendering: crispEdges;
        stroke-linecap: square;
        stroke-linejoin: miter;
      }
      .icon-stroke {
        stroke: #202020;
        stroke-width: 2;
        stroke-linecap: square;
        stroke-linejoin: miter;
      }
    ]]></style>

    <g id="tool-button">
      <rect width="38" height="38" fill="#C0C0C0" />
      <path d="M0 38V0H38" stroke="#FFFFFF" stroke-width="2" />
      <path d="M2 38H38V2" stroke="#000000" stroke-width="2" />
      <path d="M3 35H35V3" stroke="#808080" />
    </g>
    <g id="tool-button-pressed">
      <rect width="38" height="38" fill="#B4B4B4" />
      <path d="M0 38V0H38" stroke="#000000" stroke-width="2" />
      <path d="M2 36H36V2" stroke="#FFFFFF" />
      <path d="M3 35V3H35" stroke="#808080" />
    </g>
    <g id="palette-swatch-button">
      <rect width="26" height="27" fill="#C0C0C0" />
      <path d="M0 27V0H26" stroke="#FFFFFF" stroke-width="2" />
      <path d="M2 27H26V2" stroke="#000000" stroke-width="2" />
      <path d="M3 24H23V3" stroke="#808080" />
    </g>
    <pattern id="scroll-track-pattern" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="4" fill="#D4D4D4" />
      <rect width="2" height="2" fill="#C0C0C0" />
      <rect x="2" y="2" width="2" height="2" fill="#C0C0C0" />
    </pattern>
    <pattern id="selection-dots" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="2" height="2" fill="#202020" />
    </pattern>
  </defs>

